<!DOCTYPE html>
<html lang="en" class="overflow-y-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardinal Project Portal</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="stylesheet" href="dist/output.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .editable-input {
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .editable-input:hover:not(:read-only) {
            border-color: #e5e7eb;
            background: #fff;
        }
        .editable-input:focus:not(:read-only) {
            border-color: #ef4444;
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 1px #ef4444;
        }
    </style>
</head>
<body class="bg-[#f4f4f4]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 🔑 INSERT YOUR REAL FIREBASE API KEY HERE
        const FIREBASE_API_KEY = "AIzaSyC3T-SIQxCSZPd9Vbg7ixDy3hhwfJ5t7rc"; 

        const firebaseConfig = {
            apiKey: FIREBASE_API_KEY, 
            authDomain: "buildslsf.firebaseapp.com",
            projectId: "buildslsf",
            storageBucket: "buildslsf.firebasestorage.app",
            messagingSenderId: "316613726051",
            appId: "1:316613726051:web:014419d2860bb815448d56"
        };
        
        // --- MULTI-CLIENT CONFIGURATION ---
        const CLIENT_PROJECTS = {
            "director@lsfdc.org": "BLDS-WEB-001-REV5",
        };
        const ADMIN_EMAIL = "xiurzeph112112@gmail.com"; 
        const IS_DEMO_MODE = FIREBASE_API_KEY.includes("REPLACE") || FIREBASE_API_KEY.includes("YOUR_NEW");

        let db, auth;
        if (!IS_DEMO_MODE) {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
            } catch (error) {
                console.error("Firebase Init Error:", error);
            }
        }

        const STATUS = {
            TODO: 'todo', IN_PROGRESS: 'in_progress', COMPLETED: 'completed', BLOCKED: 'blocked', SKIPPED: 'skipped'
        };
        const STATUS_ORDER = [STATUS.TODO, STATUS.IN_PROGRESS, STATUS.COMPLETED, STATUS.BLOCKED, STATUS.SKIPPED];
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);

        // Clean skeleton with NO hardcoded dates or strict data
        const emptyProjectTemplate = [
            {
                id: "sprint1",
                title: "Sprint 1: Phase Name",
                dates: "TBD",
                goal: "Enter primary goal here...",
                weeks: [
                    {
                        id: "w1",
                        title: "Milestone 1",
                        checkIn: "TBD",
                        tasks: [
                            { id: "t1", title: "First task item", note: "" },
                            { id: "t2", title: "Second task item", note: "" }
                        ]
                    }
                ]
            }
        ];

        const LoginScreen = ({ onLogin }) => {
            const [mode, setMode] = useState('client');
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (!IS_DEMO_MODE && auth) {
                    auth.getRedirectResult().then((result) => {
                        if (result.user) onLogin(result.user);
                    }).catch((err) => {
                        setError("Google Sign-In Error: " + err.message);
                    });
                }
            }, []);

            const handleGoogleLogin = async () => {
                setLoading(true); setError(null);
                if (IS_DEMO_MODE) { setTimeout(() => onLogin({ email: ADMIN_EMAIL }), 800); return; }

                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    try {
                        await auth.signInWithPopup(provider);
                    } catch (popupErr) {
                        if (popupErr.code === 'auth/popup-blocked' || popupErr.code === 'auth/popup-closed-by-user') {
                            await auth.signInWithRedirect(provider);
                        } else throw popupErr;
                    }
                } catch (err) {
                    setError("Google Sign-In failed: " + err.message);
                    setLoading(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true); setError(null);
                const targetEmail = mode === 'client' ? "director@lsfdc.org" : email;
                
                if (IS_DEMO_MODE) { setTimeout(() => onLogin({ email: targetEmail }), 800); return; }

                try {
                    await auth.signInWithEmailAndPassword(targetEmail, password);
                } catch (err) {
                    setError("Access Denied. Check credentials.");
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center px-4">
                    <div className="max-w-md w-full bg-white shadow-xl rounded-lg p-8 border-t-8 border-red-600">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-900">Cardinal CS</h1>
                            <p className="text-gray-500 text-sm mt-1">{mode === 'client' ? "Client Access Portal" : "Admin Login"}</p>
                        </div>

                        {mode === 'admin' ? (
                            <div className="mb-6">
                                <button onClick={handleGoogleLogin} disabled={loading} className="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-4 rounded-lg shadow-sm">
                                    <svg className="w-6 h-6" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                    Sign in with Google
                                </button>
                                {error && <div className="bg-red-50 text-red-600 text-xs mt-4 p-3 rounded">{error}</div>}
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Project Access Code</label>
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 rounded border focus:border-red-600 outline-none" required placeholder="Enter code..." />
                                </div>
                                {error && <div className="text-red-600 text-xs">{error}</div>}
                                <button type="submit" disabled={loading} className="w-full bg-gray-900 text-white font-bold py-3 rounded hover:bg-gray-800">
                                    {loading ? "Verifying..." : "View Dashboard"}
                                </button>
                            </form>
                        )}
                        <div className="mt-6 text-center border-t pt-4">
                            <button onClick={() => { setMode(mode === 'client' ? 'admin' : 'client'); setError(null); }} className="text-xs text-gray-400 hover:text-red-600">
                                {mode === 'client' ? "Admin Login" : "Back to Client Portal"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProgressBar = ({ progress }) => (
            <div className="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                <div className="bg-red-500 h-4 rounded-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
            </div>
        );

        const StatusCheckbox = ({ status, onClick, disabled }) => {
            const base = `w-6 h-6 min-w-[24px] rounded border-2 flex items-center justify-center mt-0.5 select-none transition-all duration-200 flex-shrink-0 ${disabled ? 'opacity-50' : 'cursor-pointer'}`;
            const clickHandler = disabled ? undefined : onClick;
            switch (status) {
                case STATUS.COMPLETED: return <div onClick={clickHandler} className={`${base} border-red-500 bg-red-500`}><svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg></div>;
                case STATUS.IN_PROGRESS: return <div onClick={clickHandler} className={`${base} border-gray-900 bg-gray-900`}><svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>;
                case STATUS.BLOCKED: return <div onClick={clickHandler} className={`${base} border-amber-500 bg-amber-500`}><svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div>;
                case STATUS.SKIPPED: return <div onClick={clickHandler} className={`${base} border-gray-400 bg-gray-400`}><svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 12h14"></path></svg></div>;
                default: return <div onClick={clickHandler} className={`${base} border-gray-300 bg-white hover:border-red-500`}></div>;
            }
        };

        const Dashboard = ({ user, onLogout }) => {
            const isAdmin = user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
            
            const [allProjects, setAllProjects] = useState([]);
            const [activeProjectId, setActiveProjectId] = useState("");
            const [isCreatingNew, setIsCreatingNew] = useState(false);
            const [newProjectId, setNewProjectId] = useState("");
            const [syncStatus, setSyncStatus] = useState("loading");
            const [dbError, setDbError] = useState(null);

            // Document State
            const [plan, setPlan] = useState([]); 
            const [taskStates, setTaskStates] = useState({}); 
            const [balanceText, setBalanceText] = useState("");
            const [expandedNotes, setExpandedNotes] = useState({}); 

            // 1. Fetch All Projects (Without orderBy to prevent index errors)
            useEffect(() => {
                if (IS_DEMO_MODE) {
                    setAllProjects([{id: "DEMO-PROJECT", createdAt: Date.now()}]);
                    setActiveProjectId("DEMO-PROJECT");
                    setPlan(emptyProjectTemplate);
                    setSyncStatus("demo");
                    return;
                }

                const unsubscribe = db.collection("projects").onSnapshot(snapshot => {
                    setDbError(null);
                    let projectsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Sort in memory to strictly obey rule #2 and avoid breaking the UI
                    projectsList.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    setAllProjects(projectsList);

                    if (!activeProjectId) {
                        if (isAdmin && projectsList.length > 0) setActiveProjectId(projectsList[0].id);
                        else if (!isAdmin) {
                            const assignedId = CLIENT_PROJECTS[user.email?.toLowerCase()];
                            if (assignedId) setActiveProjectId(assignedId);
                            else setSyncStatus("no_access");
                        }
                    }
                }, err => {
                    console.error("List Sync Error:", err);
                    setDbError(err.message);
                    setSyncStatus("error");
                });
                return () => unsubscribe();
            }, [user.email, isAdmin]);

            // 2. Fetch Active Project Data
            useEffect(() => {
                if (IS_DEMO_MODE || !activeProjectId) return;
                setSyncStatus("loading");
                const unsubscribe = db.collection('projects').doc(activeProjectId).onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        setPlan(data.projectPlan || emptyProjectTemplate);
                        setTaskStates(data.taskStates || {});
                        setBalanceText(data.balanceText || "");
                        setSyncStatus("synced");
                    } else {
                        // Project doesn't exist yet (newly typed ID)
                        setPlan(emptyProjectTemplate);
                        setTaskStates({});
                        setBalanceText("");
                        setSyncStatus("synced");
                    }
                });
                return () => unsubscribe();
            }, [activeProjectId]);

            // 3. Save Data
            const saveData = async (p = plan, s = taskStates, b = balanceText) => {
                if (!isAdmin || !activeProjectId || IS_DEMO_MODE) return;
                setSyncStatus("saving");
                try {
                    await db.collection('projects').doc(activeProjectId).set({
                        projectPlan: p,
                        taskStates: s,
                        balanceText: b,
                        createdAt: Date.now() // Manually manage timestamps for JS sorting
                    }, { merge: true });
                    setSyncStatus("synced");
                } catch (e) {
                    console.error("Save Error:", e);
                    setDbError(e.message);
                    setSyncStatus("error");
                }
            };

            const createProject = async () => {
                if (!newProjectId.trim()) return;
                setActiveProjectId(newProjectId.trim());
                setIsCreatingNew(false);
                setNewProjectId("");
                // Force an immediate save to provision the DB document
                saveData(emptyProjectTemplate, {}, "");
            };

            const updateField = (sI, field, val) => {
                const np = [...plan]; np[sI][field] = val; setPlan(np);
            };
            const updateWeekField = (sI, wI, field, val) => {
                const np = [...plan]; np[sI].weeks[wI][field] = val; setPlan(np);
            };
            const updateTaskField = (sI, wI, tI, field, val) => {
                const np = [...plan]; np[sI].weeks[wI].tasks[tI][field] = val; setPlan(np);
            };
            
            const handleBlur = () => saveData(plan, taskStates, balanceText);
            const addTask = (sI, wI) => {
                const np = [...plan]; np[sI].weeks[wI].tasks.push({ id: generateId(), title: "New Task", note: "" });
                setPlan(np); saveData(np, taskStates, balanceText);
            };
            const removeTask = (sI, wI, tI) => {
                const np = [...plan]; np[sI].weeks[wI].tasks.splice(tI, 1);
                setPlan(np); saveData(np, taskStates, balanceText);
            };
            const addSprint = () => {
                const np = [...plan, { id: generateId(), title: "New Phase", dates: "", goal: "", weeks: [] }];
                setPlan(np); saveData(np, taskStates, balanceText);
            };

            const total = plan.reduce((a, s) => a + s.weeks.reduce((wa, w) => wa + w.tasks.length, 0), 0);
            const done = Object.values(taskStates).filter(s => s === STATUS.COMPLETED || s === STATUS.SKIPPED).length;
            const progress = total > 0 ? Math.round((done / total) * 100) : 0;

            return (
                <div className="min-h-screen bg-zinc-50 pb-20">
                    <header className="bg-white shadow-sm border-b sticky top-0 z-10 p-4">
                        <div className="max-w-6xl mx-auto flex justify-between items-center flex-wrap gap-4">
                            <div className="flex items-center gap-3">
                                <div>
                                    <h1 className="font-bold">Builds Setup Tracker</h1>
                                    <div className="text-[10px] text-gray-500">
                                        {syncStatus === 'saving' ? <span className="text-amber-500">Saving...</span> : <span className="text-green-600">✓ Connected</span>}
                                        <span className="mx-2">|</span> {isAdmin ? "ADMIN" : "CLIENT"}
                                    </div>
                                </div>
                            </div>

                            {isAdmin && (
                                <div className="flex items-center gap-2 bg-gray-100 p-1.5 rounded-lg border border-gray-200">
                                    {isCreatingNew ? (
                                        <>
                                            <input type="text" value={newProjectId} onChange={e => setNewProjectId(e.target.value)} placeholder="Enter New Project ID" className="text-xs px-2 py-1.5 rounded border outline-none w-48 font-mono uppercase" />
                                            <button onClick={createProject} className="bg-gray-900 text-white text-xs px-3 py-1.5 rounded font-bold hover:bg-gray-800">Create</button>
                                            <button onClick={() => setIsCreatingNew(false)} className="text-xs text-gray-500 px-2 hover:text-gray-900">Cancel</button>
                                        </>
                                    ) : (
                                        <>
                                            <select value={activeProjectId} onChange={e => setActiveProjectId(e.target.value)} className="text-xs bg-white border border-gray-300 rounded px-2 py-1.5 font-mono w-48 outline-none">
                                                <option value="" disabled>Select Project...</option>
                                                {allProjects.map(p => <option key={p.id} value={p.id}>{p.id}</option>)}
                                            </select>
                                            <button onClick={() => setIsCreatingNew(true)} className="bg-white border border-gray-300 text-gray-700 text-xs px-3 py-1.5 rounded font-bold hover:bg-gray-50">+ New</button>
                                        </>
                                    )}
                                </div>
                            )}

                            <div className="flex items-center gap-4">
                                <div className="flex flex-col items-end">
                                    <label className="text-[10px] text-gray-400 font-bold uppercase">Balance</label>
                                    {isAdmin ? (
                                        <input type="text" value={balanceText} onChange={e => setBalanceText(e.target.value)} onBlur={handleBlur} placeholder="e.g. $0.00" className="text-xs border-b border-gray-300 outline-none p-1 text-right bg-transparent w-32 font-bold" />
                                    ) : (
                                        <span className="text-xs font-bold text-gray-900">{balanceText || "None"}</span>
                                    )}
                                </div>
                                
                                {isAdmin && activeProjectId && (
                                    <button onClick={() => saveData()} disabled={syncStatus === 'saving'} className="bg-red-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-red-700">Save</button>
                                )}
                                <button onClick={() => { setActiveProjectId(""); setIsCreatingNew(false); }} className="text-xs text-gray-600 border px-3 py-2 rounded bg-white hover:bg-gray-50">Close Project</button>
                                <button onClick={onLogout} className="text-xs text-red-600 hover:underline">Sign Out</button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8">
                        {dbError && (
                            <div className="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-8">
                                <p className="font-bold text-sm">Database Error</p>
                                <p className="text-xs mt-1">{dbError}</p>
                            </div>
                        )}

                        {!activeProjectId ? (
                            <div className="text-center py-20 text-gray-400">
                                {isAdmin ? "Select or create a project above." : "No project assigned to your account."}
                            </div>
                        ) : (
                            <>
                            <div className="bg-white rounded-lg shadow-sm p-6 mb-8 border border-gray-200">
                                <div className="flex justify-between items-end mb-3">
                                    <h2 className="text-xs font-bold text-gray-500 uppercase tracking-widest">Completion Progress</h2>
                                    <span className="text-2xl font-bold text-red-600">{progress}%</span>
                                </div>
                                <ProgressBar progress={progress} />
                            </div>

                            <div className="space-y-8">
                                {plan.map((sprint, sI) => (
                                    <div key={sprint.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                        <div className="bg-gray-900 p-4 flex flex-col sm:flex-row justify-between gap-2 border-b border-gray-800">
                                            <div className="flex-grow">
                                                <input type="text" value={sprint.title} readOnly={!isAdmin} onChange={e => updateField(sI, 'title', e.target.value)} onBlur={handleBlur} className={`editable-input w-full text-base font-bold text-white mb-1 px-1 rounded ${!isAdmin && 'pointer-events-none'}`} placeholder="Phase Title..." />
                                                <input type="text" value={sprint.goal} readOnly={!isAdmin} onChange={e => updateField(sI, 'goal', e.target.value)} onBlur={handleBlur} className={`editable-input w-full text-xs text-gray-400 px-1 rounded ${!isAdmin && 'pointer-events-none'}`} placeholder="Phase goal or description..." />
                                            </div>
                                            <div className="sm:w-48">
                                                <input type="text" value={sprint.dates} readOnly={!isAdmin} onChange={e => updateField(sI, 'dates', e.target.value)} onBlur={handleBlur} className={`editable-input w-full text-xs bg-gray-800 text-gray-300 px-3 py-1.5 rounded-full text-center outline-none focus:bg-white focus:text-black ${!isAdmin && 'pointer-events-none'}`} placeholder="Dates (e.g. Jan 1 - Jan 15)" />
                                            </div>
                                        </div>
                                        
                                        <div className="p-4 grid md:grid-cols-2 gap-6">
                                            {sprint.weeks.map((week, wI) => (
                                                <div key={week.id} className="bg-gray-50 rounded-lg p-4 border border-gray-100">
                                                    <div className="flex justify-between items-start border-b border-gray-200 pb-2 mb-4">
                                                        <input type="text" value={week.title} readOnly={!isAdmin} onChange={e => updateWeekField(sI, wI, 'title', e.target.value)} onBlur={handleBlur} className={`editable-input w-2/3 text-sm font-bold text-gray-800 px-1 rounded ${!isAdmin && 'pointer-events-none'}`} placeholder="Milestone Name..." />
                                                        <input type="text" value={week.checkIn} readOnly={!isAdmin} onChange={e => updateWeekField(sI, wI, 'checkIn', e.target.value)} onBlur={handleBlur} className={`editable-input w-1/3 text-[10px] text-right text-red-600 font-bold uppercase px-1 rounded ${!isAdmin && 'pointer-events-none'}`} placeholder="Check-in Date" />
                                                    </div>
                                                    
                                                    <div className="space-y-3">
                                                        {week.tasks.map((task, tI) => (
                                                            <div key={task.id} className="flex flex-col gap-1">
                                                                <div className="flex items-start gap-3">
                                                                    <StatusCheckbox status={taskStates[task.id] || STATUS.TODO} onClick={() => { if(isAdmin) saveData(plan, {...taskStates, [task.id]: STATUS_ORDER[(STATUS_ORDER.indexOf(taskStates[task.id] || STATUS.TODO) + 1) % STATUS_ORDER.length]}, balanceText); }} disabled={!isAdmin} />
                                                                    <div className="flex-grow min-w-0">
                                                                        <input type="text" value={task.title} readOnly={!isAdmin} onChange={e => updateTaskField(sI, wI, tI, 'title', e.target.value)} onBlur={handleBlur} className={`editable-input w-full text-sm px-1 rounded ${taskStates[task.id] === STATUS.COMPLETED ? 'line-through text-gray-400' : 'text-gray-700 font-medium'} ${!isAdmin && 'pointer-events-none'}`} placeholder="Task description..." />
                                                                    </div>
                                                                    <div className="flex gap-1">
                                                                        <button onClick={() => setExpandedNotes(p => ({...p, [task.id]: !p[task.id]}))} className={`p-1 rounded hover:bg-gray-200 ${task.note ? 'text-red-500' : 'text-gray-400'}`}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></button>
                                                                        {isAdmin && <button onClick={() => removeTask(sI, wI, tI)} className="p-1 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>}
                                                                    </div>
                                                                </div>
                                                                {expandedNotes[task.id] && (
                                                                    <textarea value={task.note} readOnly={!isAdmin} onChange={e => updateTaskField(sI, wI, tI, 'note', e.target.value)} onBlur={handleBlur} className="ml-9 text-xs p-2 bg-white border border-gray-200 rounded outline-none h-16 text-gray-600 resize-none shadow-inner" placeholder="Technical notes or links..." />
                                                                )}
                                                            </div>
                                                        ))}
                                                    </div>
                                                    {isAdmin && (
                                                        <button onClick={() => addTask(sI, wI)} className="mt-4 w-full py-1.5 text-[10px] text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded border border-dashed border-gray-300 font-bold uppercase tracking-wider">+ Add Task</button>
                                                    )}
                                                </div>
                                            ))}
                                            {isAdmin && (
                                                <div className="flex items-center justify-center">
                                                    <button onClick={() => { const np = [...plan]; np[sI].weeks.push({id: generateId(), title: "New Milestone", checkIn: "", tasks: []}); setPlan(np); saveData(np, taskStates, balanceText); }} className="text-[10px] text-gray-400 hover:text-red-600 font-bold uppercase tracking-widest border-2 border-dashed border-gray-200 rounded-lg p-6 w-full h-full min-h-[120px] flex flex-col items-center justify-center gap-2 hover:bg-gray-50 transition-colors">
                                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                                                        Add Milestone Box
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            
                            {isAdmin && (
                                <button onClick={addSprint} className="mt-8 w-full py-4 bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-800 rounded-lg border-2 border-dashed border-gray-300 font-bold text-sm uppercase tracking-widest transition-colors flex items-center justify-center gap-2">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                                    Add New Phase / Sprint Segment
                                </button>
                            )}
                            </>
                        )}
                    </main>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            useEffect(() => {
                if (IS_DEMO_MODE) { setLoading(false); return; }
                const unsub = auth.onAuthStateChanged(u => { setUser(u); setLoading(false); });
                return () => unsub();
            }, []);
            
            if (loading) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><div className="animate-pulse text-gray-400 font-bold tracking-widest uppercase text-xs">Loading...</div></div>;
            return user ? <Dashboard user={user} onLogout={() => auth.signOut()} /> : <LoginScreen onLogin={setUser} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
