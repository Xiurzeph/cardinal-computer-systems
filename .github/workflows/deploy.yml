name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or "master", depending on your default branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Firebase API Key
        # This command searches for our placeholder and swaps it with the Secret
        run: |
          sed -i 's/INJECT_FIREBASE_API_KEY_HERE/${{ secrets.FIREBASE_API_KEY }}/g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the whole repository, including the modified index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4